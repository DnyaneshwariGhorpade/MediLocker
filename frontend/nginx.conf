server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is a single-page router, so unknown paths must return index.html
    # rather than 404 — otherwise a refresh on /patient/vault breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API so the browser sees one origin and CORS stays simple.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Record uploads can exceed the 1 MB nginx default.
        client_max_body_size 32m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
